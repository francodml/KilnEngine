name: Layering guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Enforce engine layering
        shell: pwsh
        run: ./Utils/guard-layering.ps1

      - name: Build
        shell: pwsh
        run: dotnet build Kiln.slnx
